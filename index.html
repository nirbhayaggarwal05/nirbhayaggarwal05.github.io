<head>

<meta name="description" content="Nirbhay Aggarwal — Founding Team Member (India Lead), AxionOrbital Space (YC W26). Tap to call, WhatsApp, email, or save contact.">

<title>Nirbhay Aggarwal · Founding Team Member (India Lead) — AxionOrbital Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090A; --panel:rgba(255,255,255,.03); --panel-2:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
    --text:#F2F4F7; --muted:#8A93A2; --dim:#5E6675;
    --accent:#7CC4FF; --accent-soft:rgba(124,196,255,.12);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --display:"Space Grotesk","Inter",-apple-system,"Segoe UI",sans-serif;
    --radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  ::selection{background:rgba(124,196,255,.28)}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:30px 18px 44px;
      position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(680px 420px at 50% -6%, rgba(124,196,255,.14), transparent 62%),
        radial-gradient(520px 380px at 92% 108%, rgba(124,196,255,.07), transparent 60%)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
      background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
      background-size:34px 34px;
      -webkit-mask-image:radial-gradient(circle at 50% 34%, #000 0%, transparent 78%);
      mask-image:radial-gradient(circle at 50% 34%, #000 0%, transparent 78%)}

  .card{position:relative;z-index:1;width:100%;max-width:432px;
      background:linear-gradient(180deg,var(--panel-2),var(--panel));
      border:1px solid var(--line);border-radius:var(--radius);padding:34px 26px 24px;text-align:center;
      box-shadow:0 40px 90px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .card::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:1px;
      background:linear-gradient(90deg,transparent,rgba(124,196,255,.75),transparent)}

  .orb-wrap{position:relative;width:146px;height:146px;margin:0 auto 20px}
  .orb-wrap .glow{position:absolute;inset:-24px;border-radius:50%;
      background:radial-gradient(circle,rgba(124,196,255,.26),transparent 66%);filter:blur(10px)}
  .orb-wrap .ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(124,196,255,.42);
      box-shadow:0 0 22px rgba(124,196,255,.20)}
  .orb-wrap .orbit{position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(255,255,255,.22);
      animation:spin 26s linear infinite}
  .orb-wrap .orbit::after{content:"";position:absolute;top:50%;left:-3px;width:5px;height:5px;border-radius:50%;
      background:var(--accent);box-shadow:0 0 9px var(--accent);transform:translateY(-50%)}
  .orb-wrap img{position:relative;z-index:1;width:146px;height:146px;border-radius:50%;object-fit:cover;
      border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 44px rgba(0,0,0,.55)}
  @keyframes spin{to{transform:rotate(360deg)}}

  .name{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.4px;margin-bottom:9px}
  .role{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10.5px;font-weight:600;
      letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
  .role::before,.role::after{content:"";width:16px;height:1px}
  .role::before{background:linear-gradient(90deg,transparent,var(--accent))}
  .role::after{background:linear-gradient(270deg,transparent,var(--accent))}
  .org{font-size:13.5px;color:var(--muted);margin-bottom:22px}
  .org b{color:var(--text);font-weight:600}

  .actions{display:flex;flex-direction:column;gap:9px}
  .act{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
      background:rgba(255,255,255,.02);border:1px solid var(--line-2);border-radius:14px;padding:12px 15px;
      transition:transform .16s,border-color .2s,background .2s}
  a.act:hover{transform:translateY(-1px);border-color:rgba(124,196,255,.5);background:var(--accent-soft)}
  .act .ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:var(--muted)}
  a.act:hover .ic{color:var(--accent);border-color:rgba(124,196,255,.4)}
  .act .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .act .txt{text-align:left;flex:1;min-width:0}
  .act .lbl{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:1.8px;
      text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .act .val{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act .arrow{color:var(--dim);font-size:15px;transition:transform .2s,color .2s}
  a.act:hover .arrow{color:var(--accent);transform:translateX(2px)}
  /* call row mirrors the link rows on hover (icon + arrow) */
  .act.act-call{cursor:default}
  .act.act-call .arrow{opacity:.9}
  .act.act-call:hover{transform:translateY(-1px);border-color:rgba(124,196,255,.5);background:var(--accent-soft)}
  .act.act-call:hover .ic{color:var(--accent);border-color:rgba(124,196,255,.4)}
  .act.act-call:hover .arrow{color:var(--accent);transform:translateX(2px)}

  .socials{display:flex;justify-content:center;gap:11px;margin:20px 0 2px}
  .soc{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;
      justify-content:center;color:var(--muted);text-decoration:none;background:rgba(255,255,255,.02);
      transition:transform .16s,border-color .2s,color .2s}
  .soc:hover{transform:translateY(-2px);border-color:rgba(124,196,255,.55);color:var(--accent)}
  .soc svg{width:18px;height:18px;fill:currentColor}

  .savebtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:20px;
      background:var(--text);color:#08090A;font-family:var(--mono);font-weight:600;font-size:12px;
      letter-spacing:1.6px;text-transform:uppercase;padding:15px;border-radius:14px;text-decoration:none;
      transition:background .2s,transform .15s,box-shadow .2s}
  .savebtn:hover{background:var(--accent);transform:translateY(-1px);box-shadow:0 12px 30px rgba(124,196,255,.28)}
  .savebtn svg{width:16px;height:16px}
  .sharebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:9px;
      background:transparent;color:var(--muted);border:1px dashed rgba(255,255,255,.18);font-family:var(--mono);
      font-weight:500;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;padding:13px;border-radius:14px;
      cursor:pointer;transition:border-color .2s,color .2s}
  .sharebtn:hover{border-color:var(--accent);color:var(--accent)}
  .sharemsg{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:8px;min-height:14px}

  .qrb{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2)}
  .qrb img{width:104px;height:104px;border-radius:12px;background:#fff;padding:7px;margin:0 auto 10px;display:block}
  .qrb .cap{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1.8px;text-transform:uppercase;font-weight:600}

  @media (prefers-reduced-motion: reduce){
    .orb-wrap .orbit{animation:none}
    *{transition:none!important}
  }
</style>
</head>
<body>

<script>
function shareCard(){
  const data = { title:"Nirbhay Aggarwal — Founding Team Member (India Lead), AxionOrbital Space",
                 text:"Nirbhay Aggarwal · Founding Team Member (India Lead), AxionOrbital Space (YC W26) · +91 896 897 3081",
                 url:location.href };
  const msg = document.getElementById('sharemsg');
  if(navigator.share){ navigator.share(data).catch(()=>{}); }
  else{
    navigator.clipboard.writeText(location.href).then(()=>{
      msg.textContent = "Link copied — share it anywhere."; setTimeout(()=>msg.textContent="",2600);
    }).catch(()=>{ msg.textContent = "Copy the URL from the address bar to share."; });
  }
}
</script>
